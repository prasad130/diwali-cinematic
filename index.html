<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diwali - A Night of Lights</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="scene"></canvas>

    <div class="intro" id="intro">

        <div class="intro-diya">🪔</div>

        <h1>A Night of Lights</h1>

        <p>Let's celebrate the festival of happiness</p>

        <button id="startBtn">Start Celebration</button>

    </div>


    <div class="wish-screen hidden" id="wishScreen">

        <div class="wish-content">

            <h1>✨ Happy Diwali ✨</h1>

            <div class="photo-frame">

                <img src="images/niru-pic2.jpeg" alt="My Photo">

            </div>

            <h2>Wishing You and Your Family</h2>

            <p>
                May this festival bring happiness,
                prosperity, success and endless joy
                into your life.
            </p>

            <h2 class="gold-text">Have a Wonderful Diwali! 🪔</h2>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
